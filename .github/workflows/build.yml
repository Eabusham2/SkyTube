name: Build, test and release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Include the macOS compatibility build
        type: boolean
        default: false
      youtube:
        description: Require live YouTube playback on all three provider settings
        type: boolean
        default: false
      video:
        description: Public YouTube video ID for the optional playback check
        type: string
        default: aqz-KE-bpKQ
      publish:
        description: Publish a new version after the checks pass (main only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test playback verification
        if: runner.os == 'Linux'
        run: python3 -I .github/scripts/test-verify-playback.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the embedded player
        run: node --test tests/web/*.test.js
      - name: Run Java tests and remap production JARs
        run: ./gradlew --stacktrace clean build
      - name: Verify and checksum release JARs
        if: runner.os == 'Linux'
        id: package
        run: |
          set -euo pipefail
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          number='(0|[1-9][0-9]*)'
          pre='(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][a-zA-Z0-9-]*)'
          meta='[a-zA-Z0-9-]+'
          semver="^$number\.$number\.$number(-$pre(\.$pre)*)?(\+$meta(\.$meta)*)?$"
          [[ "$version" =~ $semver ]] || { echo "Invalid semantic mod_version: $version" >&2; exit 1; }
          base="skytube-fabric-$mc-$version"
          cd build/libs
          unzip -tq "$base.jar"
          unzip -tq "$base-sources.jar"
          unzip -p "$base.jar" fabric.mod.json | jq -e --arg v "$version" --arg mc "~$mc" \
            '.id == "skytube" and .version == $v and .environment == "client" and .depends.minecraft == $mc'
          sha256sum "$base.jar" "$base-sources.jar" > SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: release-assets
          path: |
            build/libs/${{ steps.package.outputs.base }}.jar
            build/libs/${{ steps.package.outputs.base }}-sources.jar
            build/libs/SHA256SUMS.txt
          if-no-files-found: error
          overwrite: true

  client:
    name: Minecraft and Chromium on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      token: ${{ steps.evidence.outputs.token }}
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display and OpenGL libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libgl1-mesa-dri libgtk-3-0t64 libnss3 libasound2t64
      - name: Start a fresh playback report
        if: inputs.youtube
        id: evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm -f build/run/clientGameTest/youtube-playback-evidence.json
          echo "token=$(python3 -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_OUTPUT"
      - name: Render a Chromium page inside a singleplayer world
        env:
          SMOKE_YOUTUBE: ${{ inputs.youtube || false }}
          SMOKE_YOUTUBE_VIDEO: ${{ inputs.video }}
          SKYTUBE_PLAYBACK_RUN: ${{ steps.evidence.outputs.token }}
          SKYTUBE_PLAYBACK_COMMIT: ${{ github.sha }}
        run: xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew --stacktrace -PsmokeTextureOnly=false "-PsmokeYouTube=$SMOKE_YOUTUBE" "-PsmokeYouTubeVideo=$SMOKE_YOUTUBE_VIDEO" runClientGameTest
      - name: Check cloud mask pixels against the Minecraft client shaders
        run: |
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          python3 tests/render/cloud_mask_smoke.py --client-jar "${GRADLE_USER_HOME:-$HOME/.gradle}/caches/fabric-loom/$mc/minecraft-client.jar"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-smoke-evidence
          path: |
            build/run/clientGameTest/screenshots
            build/run/clientGameTest/logs/latest.log
            build/run/clientGameTest/crash-reports
            build/run/clientGameTest/youtube-playback-evidence.json
          if-no-files-found: error
          overwrite: true

  verify-playback:
    name: Verify live YouTube playback
    if: inputs.youtube
    needs: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: client-smoke-evidence
          path: evidence
      - name: Verify observed playback independently
        env:
          EXPECTED_TOKEN: ${{ needs.client.outputs.token }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_VIDEO: ${{ inputs.video }}
        run: python3 -I .github/scripts/verify-playback.py evidence/youtube-playback-evidence.json

  publish:
    name: Publish release
    needs: [build, client, verify-playback]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && !github.event.deleted) || (github.event_name == 'workflow_dispatch' && inputs.publish)) &&
      needs.build.result == 'success' && needs.client.result == 'success' &&
      ((inputs.youtube && needs.verify-playback.result == 'success') || (!inputs.youtube && needs.verify-playback.result == 'skipped'))
    runs-on: ubuntu-latest
    concurrency:
      group: skytube-publish-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          die() { echo "$*" >&2; exit 1; }
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          tag="v$version"
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          base="skytube-fabric-$mc-$version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cd assets
          sha256sum --check --strict SHA256SUMS.txt

          tag_commit() {
            git fetch --quiet --no-tags origin "refs/tags/$tag" || return 1
            git rev-parse --verify 'FETCH_HEAD^{commit}'
          }
          verify_tag() {
            [[ "$(tag_commit)" == "$GITHUB_SHA" ]] || die "$tag no longer points to the tested commit."
          }
          require_draft() {
            verify_tag
            [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == true ]] || die "$tag is no longer a draft."
          }

          releases=$(gh api --paginate 'repos/{owner}/{repo}/releases?per_page=100')
          state=$(jq -ers --arg tag "$tag" '
            [ .[][] | select(.tag_name == $tag) ] |
            if length == 0 then "absent"
            elif length != 1 then error("multiple releases for the same tag")
            elif .[0].draft then "draft" else "published" end' <<< "$releases")
          remote_tag=$(git ls-remote --refs origin "refs/tags/$tag")
          if [[ -n "$remote_tag" ]]; then
            commit=$(tag_commit)
            if [[ "$commit" != "$GITHUB_SHA" ]]; then
              [[ "$state" == published ]] && git merge-base --is-ancestor "$commit" "$GITHUB_SHA" || die "$tag belongs to a different commit."
              echo "Version $version is already published from $commit." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$state" != published ]]; then
              git fetch --quiet --no-tags origin refs/heads/main
              git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || die "The tagged commit is no longer on main."
            fi
          else
            [[ "$state" == absent ]] || die "Existing release $tag has lost its tag."
            main=$(git ls-remote --exit-code origin refs/heads/main)
            if [[ "${main%%[[:space:]]*}" != "$GITHUB_SHA" ]]; then
              echo "Main advanced before publication of $tag." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            gh api --method POST 'repos/{owner}/{repo}/git/refs' -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" --silent
          fi

          verify_tag
          if [[ "$state" == published ]]; then
            gh release download "$tag" --dir "$RUNNER_TEMP/published"
            diff -qr . "$RUNNER_TEMP/published"
            echo "Verified the existing $tag release assets." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$state" == absent ]]; then
            flags=(--draft --verify-tag --target "$GITHUB_SHA" --generate-notes --title "SkyTube $tag")
            if [[ "${version%%+*}" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$tag" "${flags[@]}"
          fi

          # Resume an interrupted draft only when each existing asset matches this build.
          require_draft
          count=$(gh release view "$tag" --json assets --jq '.assets | length')
          prior=$(mktemp -d)
          if (( count > 0 )); then
            gh release download "$tag" --dir "$prior"
            for file in "$prior"/*; do
              cmp "$file" "${file##*/}"
            done
          fi
          for file in "$base.jar" "$base-sources.jar" SHA256SUMS.txt; do
            if [[ ! -f "$prior/$file" ]]; then
              require_draft
              gh release upload "$tag" "$file"
            fi
          done
          gh release download "$tag" --dir "$RUNNER_TEMP/complete"
          diff -qr . "$RUNNER_TEMP/complete"
          require_draft
          gh release edit "$tag" --draft=false
          verify_tag
          [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == false ]] || die "$tag was not published."
          echo "Published $tag from $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
