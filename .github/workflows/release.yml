name: Release SkyTube

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v1.0.0
        type: string
        required: true
      youtube:
        description: Require live YouTube playback (the CI runner may need to sign in)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: python
        run: |
          import os
          import re
          import sys

          number = r"(?:0|[1-9][0-9]*)"
          ident = r"[0-9A-Za-z-]+"
          pattern = rf"v{number}\.{number}\.{number}(?:-({ident}(?:\.{ident})*))?(?:\+{ident}(?:\.{ident})*)?"
          match = re.fullmatch(pattern, os.environ["RELEASE_TAG"])
          if match is None or any(
              item.isdigit() and len(item) > 1 and item.startswith("0")
              for item in (match.group(1) or "").split(".")
          ):
              sys.exit("Use a v-prefixed Semantic Versioning 2.0.0 tag.")
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Resolve the tagged commit
        id: resolve
        run: |
          set -eu
          commit=$(git rev-parse --verify 'HEAD^{commit}')
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$(git rev-parse --verify "${GITHUB_SHA}^{commit}")" = "$commit"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Match mod version to the tag
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          test "v$version" = "$RELEASE_TAG"

  client-smoke:
    needs: resolve
    uses: ./.github/workflows/smoke.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      youtube: ${{ github.event_name == 'workflow_dispatch' && inputs.youtube || false }}
      video: aqz-KE-bpKQ

  build:
    needs: [resolve, client-smoke]
    name: Build and verify release JARs
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      PLAYBACK_COMMIT: ${{ needs.client-smoke.outputs.playback_commit }}
      REQUIRE_YOUTUBE: ${{ github.event_name == 'workflow_dispatch' && inputs.youtube || false }}
    steps:
      - name: Record verification for the exact release commit
        run: |
          set -eu
          test -n "$RELEASE_COMMIT"
          printf 'The required native Minecraft/Chromium fixture passed for %s.\n' "$RELEASE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$REQUIRE_YOUTUBE" == true ]]; then
            test "$PLAYBACK_COMMIT" = "$RELEASE_COMMIT"
            echo "Live YouTube playback passed for all three provider selections." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The optional live YouTube check was skipped. External playback is unverified for this release run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - name: Test optional playback verification
        run: python3 -I .github/scripts/test-verify-playback.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/web/*.test.js
      - run: ./gradlew --stacktrace clean build
      - name: Verify and checksum release JARs
        run: |
          set -eu
          cd build/libs
          mc=$(sed -n 's/^minecraft_version=//p' ../../gradle.properties)
          base="skytube-fabric-$mc-${RELEASE_TAG#v}"
          test -s "$base.jar"
          test -s "$base-sources.jar"
          unzip -tq "$base.jar"
          unzip -tq "$base-sources.jar"
          unzip -p "$base.jar" fabric.mod.json | jq -e --arg v "${RELEASE_TAG#v}" '.id == "skytube" and .version == $v'
          sha256sum "$base.jar" "$base-sources.jar" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: [resolve, client-smoke, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: Publish verified release assets
        shell: bash
        run: |
          set -euo pipefail
          verify_tag() {
            git fetch --quiet --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG"
            if [[ "$(git rev-parse --verify 'FETCH_HEAD^{commit}')" != "$RELEASE_COMMIT" ]]; then
              echo "Release tag no longer points at the verified commit." >&2
              exit 1
            fi
          }
          cd assets
          sha256sum --check SHA256SUMS.txt
          verify_tag
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            flags=(--verify-tag --draft --generate-notes --title "SkyTube $RELEASE_TAG")
            if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then flags+=(--prerelease); fi
            verify_tag
            gh release create "$RELEASE_TAG" "${flags[@]}"
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]; then
            verify_tag
            gh release upload "$RELEASE_TAG" ./*.jar SHA256SUMS.txt --clobber
            verify_tag
            gh release edit "$RELEASE_TAG" --draft=false
          else
            mkdir prior
            gh release download "$RELEASE_TAG" --dir prior
            cmp SHA256SUMS.txt prior/SHA256SUMS.txt
            (cd prior && sha256sum --check SHA256SUMS.txt)
          fi
