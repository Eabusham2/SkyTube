name: Minecraft client smoke test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to test
        default: main
        required: true
        type: string
      youtube:
        description: Check external YouTube playback for all three provider settings
        type: boolean
        default: false
      video:
        description: Public YouTube video ID for the optional playback check
        type: string
        default: M7lc1UVf-VE
  workflow_call:
    outputs:
      playback_commit:
        description: Commit whose complete real-playback report passed independent verification
        value: ${{ jobs.verify-playback.outputs.commit }}
    inputs:
      ref:
        required: true
        type: string
      youtube:
        type: boolean
        default: false
      video:
        type: string
        default: M7lc1UVf-VE

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      token: ${{ steps.evidence.outputs.token }}
      commit: ${{ steps.evidence.outputs.commit }}
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Start a fresh playback report
        if: inputs.youtube
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f build/run/clientGameTest/youtube-playback-evidence.json
          echo "token=$(python3 -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --verify 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"
      - name: Install virtual display and OpenGL libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libgtk-3-0t64 libnss3 libasound2t64
      - name: Render a Chromium page inside a singleplayer world
        env:
          SMOKE_YOUTUBE: ${{ inputs.youtube }}
          SMOKE_YOUTUBE_VIDEO: ${{ inputs.video }}
          SKYTUBE_PLAYBACK_RUN: ${{ steps.evidence.outputs.token }}
          SKYTUBE_PLAYBACK_COMMIT: ${{ steps.evidence.outputs.commit }}
        run: xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew --stacktrace -PsmokeTextureOnly=false "-PsmokeYouTube=$SMOKE_YOUTUBE" "-PsmokeYouTubeVideo=$SMOKE_YOUTUBE_VIDEO" runClientGameTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-smoke-evidence
          path: |
            build/run/clientGameTest/screenshots
            build/run/clientGameTest/logs/latest.log
            build/run/clientGameTest/crash-reports
            build/run/clientGameTest/youtube-playback-evidence.json
          if-no-files-found: ignore

  verify-playback:
    if: inputs.youtube
    needs: client
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: client-smoke-evidence
          path: evidence
      - name: Verify observed playback independently
        id: check
        env:
          EXPECTED_TOKEN: ${{ needs.client.outputs.token }}
          EXPECTED_COMMIT: ${{ needs.client.outputs.commit }}
          EXPECTED_VIDEO: ${{ inputs.video }}
        run: |
          set -eu
          python3 -I .github/scripts/test-verify-playback.py
          python3 -I .github/scripts/verify-playback.py evidence/youtube-playback-evidence.json
          echo "commit=$EXPECTED_COMMIT" >> "$GITHUB_OUTPUT"
