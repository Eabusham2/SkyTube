name: Minecraft client smoke test

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display and OpenGL libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libgtk-3-0t64 libnss3 libasound2t64
      - name: Render a Chromium page inside a singleplayer world
        run: xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew --stacktrace runClientGameTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-smoke-evidence
          path: |
            build/run/clientGameTest/screenshots
            build/run/clientGameTest/logs/latest.log
            build/run/clientGameTest/crash-reports
          if-no-files-found: ignore
